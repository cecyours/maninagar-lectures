<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Form</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f2f2f2;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    form{
      width:500px;
      background:#fff;
      padding:25px;
      border-radius:10px;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
      color:#333;
    }

    label{
      display:block;
      font-weight:bold;
      margin-top:15px;
      margin-bottom:5px;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:15px;
      margin-bottom:10px;
    }

    input:focus,
    select:focus,
    textarea:focus{
      outline:none;
      border-color:#007bff;
      box-shadow:0 0 5px rgba(0,123,255,.3);
    }

    textarea{
      resize:vertical;
    }

    .checkbox-group,
    .radio-group{
      display:flex;
      gap:20px;
      margin-bottom:15px;
    }

    .checkbox-group label,
    .radio-group label{
      display:flex;
      align-items:center;
      gap:5px;
      font-weight:normal;
      margin:0;
    }

    .checkbox-group input,
    .radio-group input{
      width:auto;
      margin:0;
    }

    input[type="color"]{
      height:45px;
      cursor:pointer;
    }

    input[type="range"]{
      padding:0;
    }

    input[type="submit"]{
      background:#007bff;
      color:white;
      border:none;
      cursor:pointer;
      font-size:16px;
      margin-top:15px;
      transition:.3s;
    }

    input[type="submit"]:hover{
      background:#0056b3;
    }
  </style>
</head>

<body>

<form>

  <h2>Registration Form</h2>

  <label>First Name</label>
  <input type="text" placeholder="Enter First Name">

  <label>Last Name</label>
  <input type="text" placeholder="Enter Last Name">

  <label>Mobile Number</label>
  <input type="number" placeholder="Enter Mobile Number">

  <label>Date & Time</label>
  <input type="datetime-local">

  <label>Hobbies</label>

  <div class="checkbox-group">
    <label><input type="checkbox"> Game</label>
    <label><input type="checkbox"> Dance</label>
    <label><input type="checkbox"> Book</label>
  </div>

  <label>Favorite Color</label>
  <input type="color">

  <label>Email</label>
  <input type="email" placeholder="Enter Email">

  <label>Upload File</label>
  <input type="file">

  <label>Password</label>
  <input type="password" placeholder="Enter Password">

  <label>Gender</label>

  <div class="radio-group">
    <label><input type="radio" name="gender"> Male</label>
    <label><input type="radio" name="gender"> Female</label>
    <label><input type="radio" name="gender"> Other</label>
  </div>

  <label>Range</label>
  <input type="range" min="0" max="100">

  <label>City</label>

  <select>
    <option>Select City</option>
    <option>Ahmedabad</option>
    <option>Surat</option>
    <option>Mehsana</option>
    <option>Gota</option>
    <option>Himmatnagar</option>
  </select>

  <label>Message</label>

  <textarea rows="4" placeholder="Write something..."></textarea>

  <label>Choose Browser</label>

  <input list="browsers" placeholder="Select Browser">

  <datalist id="browsers">
    <option value="Chrome">
    <option value="Firefox">
    <option value="Safari">
    <option value="Edge">
    <option value="Opera">
  </datalist>

  <input type="submit" value="Submit">

</form>

</body>
</html>
